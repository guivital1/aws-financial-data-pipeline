[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-financial-data-pipeline"
version = "0.1.0"
description = "Automated Brazilian financial data pipeline designed for AWS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Vital" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "dbt-duckdb>=1.9,<2",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
financial-pipeline = "financial_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
