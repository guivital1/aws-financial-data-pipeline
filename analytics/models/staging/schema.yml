version: 2

models:
  - name: stg_bcb_observations
    description: Typed and normalized observations sourced from the official BCB SGS API.
    columns:
      - name: series_slug
        tests: [not_null]
      - name: observation_date
        tests: [not_null]
      - name: value
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series_slug, observation_date]
