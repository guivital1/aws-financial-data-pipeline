name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check src scripts tests
      - run: pytest
      - run: python scripts/check_snapshot_quality.py
      - run: python scripts/export_warehouse_seed.py
      - run: mkdir -p analytics/warehouse
      - run: dbt deps --project-dir analytics --profiles-dir analytics
      - run: dbt build --project-dir analytics --profiles-dir analytics
      - run: python -m compileall -q src tests glue
